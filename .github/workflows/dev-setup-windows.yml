name: Windows dev setup

on:
  pull_request:
  push:
    branches: win-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-setup:
    name: Dev setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            msystem: UCRT64
          - os: windows-11-arm
            msystem: CLANGARM64
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # Keep the directly installed opam on PATH in the MSYS2 shell.
          path-type: inherit
          install: git make curl
          pacboy: clang:p cmake:p python:p

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5
          windows-environment: msys2

      - name: Install prerequisites, build, and test
        shell: msys2 {0}
        run: bash -x tools/dev_setup.sh
