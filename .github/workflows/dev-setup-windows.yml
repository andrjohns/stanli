name: Windows dev setup

on:
  pull_request:
  push:
    branches: win-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-setup:
    name: Dev setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            msystem: UCRT64
          - os: windows-11-arm
            msystem: CLANGARM64
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # Keep the action-installed opam on PATH in the MSYS2 shell.
          path-type: inherit
          install: git make curl
          pacboy: clang:p llvm-tools:p cmake:p python:p

      - name: Install opam
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $opamDir = Join-Path $env:RUNNER_TEMP 'opam-bin'
          New-Item -ItemType Directory -Force -Path $opamDir | Out-Null
          $opamExe = Join-Path $opamDir 'opam.exe'
          # Upstream ships an x64 Windows binary, also used under emulation on ARM64.
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/ocaml/opam/releases/download/2.5.2/opam-2.5.2-x86_64-windows.exe' -OutFile $opamExe
          if ((Get-FileHash -Algorithm SHA256 $opamExe).Hash -ne '51a530f538e86913489b061ac13c6084276e5dc916f5bd5c450883a826f8864c') {
            throw 'opam download checksum mismatch'
          }
          & $opamExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $opamDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install prerequisites, build, and test
        run: bash -x tools/dev_setup.sh --embed
        shell: msys2 {0}
