name: Windows dev setup

on:
  pull_request:
  push:
    branches: win-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-setup:
    name: Dev setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Ensure WinGet is available
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsApps = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          $env:PATH = "$windowsApps;$env:PATH"
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers
          }
          & winget.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $windowsApps | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install prerequisites, build, and test
        shell: bash
        run: bash -x tools/dev_setup.sh
