# Windows, milestone one: the runtime and its test suite under mingw-w64
# (stan-math does not build under MSVC, which is why RStan ships through
# RTools). The wheel comes after this is green: it additionally needs the
# shared library with a .def export list, and either opam's Windows
# support for the embedded stanc3 or the release stanc.exe as the
# subprocess fallback.
name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: mingw-w64 tests
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
            unzip
            curl

      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh

      - name: Configure and build
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j4

      - name: Tests
        run: cd build-win && ctest --output-on-failure
